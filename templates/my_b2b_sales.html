
{% extends "base.html" %}
{% block content %}
<div class="container my-4">
  <h2>Marketplace Products</h2>
  <ul class="list-group">
    {% for product in products %}
      <li class="list-group-item">
        <a href="{{ url_for('b2b_product_detail', product_id=product.id) }}">{{ product.title }}</a>
        - ₹{{ product.price }} ({{ product.quantity }} in stock)
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
