{% extends "base.html" %}
{% block content %}
<div class="container my-4">
  <h2>Add B2B Product</h2>
  <form method="POST">
    <div class="form-group mb-2">
      <input type="text" name="title" placeholder="Title" class="form-control" required>
    </div>
    <div class="form-group mb-2">
      <textarea name="description" placeholder="Description" class="form-control" required></textarea>
    </div>
    <div class="form-group mb-2">
      <input type="number" name="price" placeholder="Price" class="form-control" required>
    </div>
    <div class="form-group mb-2">
      <input type="number" name="quantity" placeholder="Quantity" class="form-control" required>
    </div>
    <div class="form-check mb-2">
      <input type="checkbox" name="is_farm_product" class="form-check-input">
      <label class="form-check-label">Farm Product?</label>
    </div>
    <button type="submit" class="btn btn-success">Add Product</button>
  </form>
</div>
{% endblock %}
