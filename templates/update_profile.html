<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Profile - AgriTech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="mb-4">Update Profile</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('update_profile') }}" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <input
      type="text"
      class="form-control"
      id="username"
      name="username"
      value="{{ user.username }}"
      required
    />
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      value="{{ user.email }}"
      required
    />
  </div>

  <div class="mb-3">
    <label for="bio" class="form-label">Bio</label>
    <textarea
      class="form-control"
      id="bio"
      name="bio"
      rows="4"
      placeholder="Tell us something about yourself..."
    >{{ user.bio }}</textarea>
  </div>

  <div class="mb-3">
    <label for="profile_pic" class="form-label">Profile Picture</label>
    {% if user.profile_picture %}
      <div class="mb-2">
        <img src="{{ url_for('static', filename='profile_pics/' ~ user.profile_picture) }}"
             alt="Current Profile Picture"
             width="100"
             height="100"
             class="rounded-circle border">
      </div>
    {% endif %}
    <input
      class="form-control"
      type="file"
      id="profile_pic"
      name="profile_pic"
      accept="image/*"
    />
  </div>


      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
