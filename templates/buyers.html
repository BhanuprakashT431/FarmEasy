{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Farm Products Marketplace</h2>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ product.title }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p><strong>Price:</strong> ₹{{ product.price }} per unit</p>
                    <p><strong>Available:</strong> {{ product.quantity }} units</p>
                    <form action="{{ url_for('place_order', product_id=product.id) }}" method="POST">

                        <input type="hidden" name="product_id" value="{{ product.id }}">
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" required>
                        </div>
                        <div class="form-group mt-2">
                            <label>Delivery Address</label>
                            <textarea name="delivery_address" class="form-control" placeholder="Enter delivery address" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm mt-3">Place Order</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
