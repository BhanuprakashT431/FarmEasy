<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Tracker - Grow Smarter</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #115e3b;
            --accent-green: #22c55e;
            --light-cream: #f4fdf8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--light-cream);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Abstract Green Animated Background */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f4c30, #1b8554);
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: float 20s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 600px;
            height: 600px;
            top: -10%;
            left: -10%;
            animation-duration: 25s;
        }

        .shape-2 {
            width: 800px;
            height: 800px;
            bottom: -20%;
            right: -10%;
            background: rgba(34, 197, 94, 0.1);
            animation-duration: 22s;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 60%;
            background: rgba(255, 255, 255, 0.08);
            animation-duration: 18s;
            animation-delay: 5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(50px, 50px) scale(1.05) rotate(10deg); }
            100% { transform: translate(-30px, -60px) scale(0.95) rotate(-5deg); }
        }

        /* Content Overlay Area */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #ffffff;
            max-width: 800px;
            padding: 2rem;
            /* Glassmorphism card */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(30px);
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #c7f2d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .btn-custom {
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin: 0 10px;
        }

        .btn-login {
            background-color: #ffffff;
            color: var(--primary-green);
            border: 2px solid #ffffff;
        }

        .btn-login:hover {
            background-color: transparent;
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .btn-register {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-register:hover {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.4);
            transform: translateY(-3px);
        }

        /* Organic leaf accents */
        .leaf-decor {
            position: absolute;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.15);
            animation: sway 6s infinite ease-in-out alternate;
        }

        .leaf-1 { top: -20px; left: -20px; transform: rotate(-45deg); }
        .leaf-2 { bottom: -20px; right: -20px; transform: rotate(135deg); font-size: 4rem; }

        @keyframes sway {
            0% { transform: rotate(-45deg) translateX(0); }
            100% { transform: rotate(-35deg) translateX(10px); }
        }

        /* Floating features */
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            opacity: 0;
        }

        .feature-item {
            text-align: center;
            color: rgba(255,255,255,0.9);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-green);
            background: rgba(255,255,255,0.1);
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
        }

    </style>
</head>
<body>

    <section class="hero">
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="content" id="mainCard">
            <i class="fa-solid fa-leaf leaf-decor leaf-1"></i>
            <i class="fa-solid fa-seedling leaf-decor leaf-2"></i>
            
            <h1 class="title">Farm Tracker</h1>
            <p class="subtitle">Empowering modern farmers with intelligent crop tracking, seamless B2B marketplace, and smart analytics all in one place.</p>
            
            <div class="d-flex justify-content-center flex-wrap gap-3">
                <a href="{{ url_for('login') }}" class="btn btn-custom btn-login text-decoration-none">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-custom btn-register text-decoration-none">Register</a>
            </div>

            <div class="features" id="featuresRow">
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <span>Track Expenses</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-truck-fast"></i></div>
                    <span>B2B Market</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fa-solid fa-cloud-sun"></i></div>
                    <span>Smart Tools</span>
                </div>
            </div>
        </div>
    </section>

    <!-- GSAP for smooth animations on load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.to("#mainCard", {
                y: 0,
                opacity: 1,
                duration: 1.5,
                ease: "power3.out",
                delay: 0.2
            });

            gsap.to("#featuresRow", {
                opacity: 1,
                y: -10,
                duration: 1,
                ease: "power3.out",
                delay: 1.2
            });
            
            gsap.from(".feature-item", {
                y: 20,
                opacity: 0,
                stagger: 0.2,
                duration: 0.8,
                ease: "back.out(1.7)",
                delay: 1.2
            });
        });
    </script>
</body>
</html>
